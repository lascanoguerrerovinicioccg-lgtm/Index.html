<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Pro - Edición Zafiro</title>
    <!-- Librería de reproducción HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Librería de iconos (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Paleta de colores Azul Satinado */
            --bg-dark: #070b14;
            --panel-bg: linear-gradient(180deg, #0f172a 0%, #080f1d 100%);
            --card-bg: linear-gradient(145deg, #16233d, #0d1627);
            --accent-blue: #3b82f6;
            --accent-satin: #60a5fa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        
        body { 
            margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; height: 100vh; overflow: hidden; user-select: none;
        }
        
        /* Contenedor del Reproductor */
        #player-wrapper {
            flex: 1; background: #000; display: flex; flex-direction: column; position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
        video { 
            width: 100%; height: 100%; object-fit: contain; outline: none; background: #000;
        }

        /* Menú Lateral (Diseño Satinado) */
        #sidebar { 
            width: 380px; background: var(--panel-bg); display: flex; flex-direction: column;
            border-left: 1px solid rgba(59, 130, 246, 0.2); box-shadow: -10px 0 30px rgba(0,0,0,0.8); z-index: 10;
        }
        .header {
            padding: 25px 20px; border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            background: linear-gradient(90deg, rgba(15,23,42,1) 0%, rgba(30,58,138,0.3) 100%);
        }
        .header h2 { 
            margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 0.5px;
            text-shadow: var(--glow); color: var(--accent-satin);
            display: flex; align-items: center; gap: 10px;
        }
        .header p { margin: 8px 0 0 0; font-size: 13px; color: var(--text-muted); }
        
        #channel-grid {
            flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: 1fr; gap: 12px;
        }
        
        /* Ocultar barra de scroll para un look TV fluido */
        #channel-grid::-webkit-scrollbar { width: 4px; }
        #channel-grid::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 4px; }

        /* Tarjetas de Canales y VOD */
        .channel-card { 
            background: var(--card-bg); border-radius: 12px; padding: 16px; 
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; align-items: center; gap: 15px; position: relative; overflow: hidden;
        }
        /* Efecto brillo al pasar el foco */
        .channel-card::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }
        .channel-card:hover::after, .channel-card:focus::after { left: 100%; }
        
        .channel-card:hover, .channel-card:focus {
            background: rgba(30, 58, 138, 0.4); border-color: var(--accent-satin); 
            transform: translateX(-5px) scale(1.02); outline: none; box-shadow: var(--glow);
        }
        .channel-card.active {
            border-color: var(--accent-blue); background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid var(--accent-satin);
        }
        
        /* Iconos dinámicos */
        .card-icon {
            font-size: 20px; color: var(--accent-blue);
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); border-radius: 50%; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .channel-card.active .card-icon { color: #fff; background: var(--accent-blue); box-shadow: var(--glow); }

        .channel-info { flex: 1; overflow: hidden; }
        .channel-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-group { 
            font-size: 11px; color: var(--accent-satin); margin-top: 6px; 
            text-transform: uppercase; letter-spacing: 1px; font-weight: 600; 
        }

        #loader { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 18px; }

        /* Adaptación Responsiva */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #player-wrapper { flex: none; height: 35vh; }
            #sidebar { width: 100%; height: 65vh; border-left: none; border-top: 1px solid rgba(59, 130, 246, 0.3); }
        }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <video id="video" controls autoplay></video>
    </div>

    <div id="sidebar">
        <div class="header">
            <h2><i class="fa-solid fa-play"></i> IPTV Pro</h2>
            <p>Conectado al servidor Xtream Codes</p>
        </div>
        <div id="channel-grid">
            <div id="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Cargando contenido...</div>
        </div>
    </div>

    <script>
        // URL de la lista con el parámetro de compatibilidad 'output=m3u8'
        const M3U_URL = 'http://line.dndnscloud.ru/get.php?username=130ac073a2&password=dbdd4a0b97cb&type=m3u_plus&output=m3u8';
        let hlsInstance = null;

        async function loadChannels() {
            try {
                const response = await fetch(M3U_URL);
                const text = await response.text();
                parseM3U(text);
            } catch (error) {
                document.getElementById('channel-grid').innerHTML = 
                    `<div id="loader" style="color:#ef4444;">
                        <i class="fa-solid fa-triangle-exclamation"></i><br><br>
                        Error de red por bloqueo HTTPS (CORS).<br><br>
                        Para probarlo en tu laptop, haz doble clic en el archivo index.html para abrirlo como archivo local, no uses el enlace de Vercel.
                    </div>`;
            }
        }

        function parseM3U(text) {
            const lines = text.split('\n');
            const channels = [];
            let currentChannel = { group: 'General' };

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    // Extraer grupo (categoría)
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) currentChannel.group = groupMatch[1];
                    
                    // Extraer nombre del canal o película
                    const parts = line.split(',');
                    currentChannel.name = parts[parts.length - 1].trim();
                } else if (line.startsWith('http')) { 
                    currentChannel.url = line;
                    
                    // Detección automática: ¿Es Película/Serie o Canal en Vivo?
                    const urlLower = line.toLowerCase();
                    currentChannel.isVod = urlLower.includes('.mp4') || urlLower.includes('.mkv') || urlLower.includes('.avi') || urlLower.includes('/movie/') || urlLower.includes('/series/');
                    
                    channels.push({...currentChannel});
                    currentChannel = { group: 'General' }; // Reiniciar objeto
                }
            }
            
            // Limitamos a 300 resultados para que el navegador no se congele durante la prueba
            renderChannels(channels.slice(0, 300)); 
        }

        function renderChannels(channels) {
            const grid = document.getElementById('channel-grid');
            grid.innerHTML = '';
            
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.tabIndex = index + 1;
                
                // Asignar el icono correcto basado en la detección (Película vs TV)
                const iconClass = channel.isVod ? 'fa-solid fa-film' : 'fa-solid fa-tv';
                
                card.innerHTML = `
                    <div class="card-icon">
                        <i class="${iconClass}"></i>
                    </div>
                    <div class="channel-info">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-group">${channel.group}</div>
                    </div>
                `;
                
                card.onclick = () => {
                    document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    
                    // Cambiar temporalmente el icono a "reproduciendo"
                    const currentIcon = card.querySelector('.card-icon i');
                    const originalClass = currentIcon.className;
                    currentIcon.className = 'fa-solid fa-play';
                    setTimeout(() => { currentIcon.className = originalClass; }, 2000);

                    playChannel(channel.url, channel.isVod);
                };

                card.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') { card.click(); }
                });

                grid.appendChild(card);
            });
        }

        function playChannel(url, isVod) {
            const video = document.getElementById('video');
            if (hlsInstance) { 
                hlsInstance.destroy(); 
                hlsInstance = null;
            }

            if (isVod) {
                // Si es película (VOD), el navegador la reproduce de forma nativa sin HLS
                video.src = url;
                video.play().catch(e => console.log("Esperando interacción del usuario para reproducir."));
            } else if (Hls.isSupported()) {
                // Si es canal en vivo, usamos la librería HLS
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Esperando interacción del usuario para reproducir."));
                });
            } else {
                // Fallback para Safari / iOS
                video.src = url;
                video.play();
            }
        }

        loadChannels();
    </script>
</body>
</html>
