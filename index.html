<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Pro UI</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #151b2b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body { 
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; height: 100vh; overflow: hidden; user-select: none;
        }
        
        /* Contenedor del Reproductor */
        #player-wrapper {
            flex: 1; background: #000; display: flex; flex-direction: column; position: relative;
        }
        video { 
            width: 100%; height: 100%; object-fit: contain; outline: none; background: #000;
        }

        /* Panel de Canales */
        #sidebar { 
            width: 350px; background-color: var(--panel-bg); display: flex; flex-direction: column;
            border-left: 1px solid #1e293b; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 10;
        }
        .header {
            padding: 20px; border-bottom: 1px solid #1e293b;
        }
        .header h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: var(--text-muted); }
        
        #channel-grid {
            flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: 1fr; gap: 10px;
        }
        
        /* Ocultar barra de scroll para un look TV */
        #channel-grid::-webkit-scrollbar { width: 6px; }
        #channel-grid::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        /* Tarjetas de Canales */
        .channel-card { 
            background: #1e293b; border-radius: 12px; padding: 16px; border: 2px solid transparent;
            cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center;
        }
        .channel-card:hover, .channel-card:focus {
            background: #253247; border-color: var(--accent); transform: scale(1.02); outline: none;
        }
        .channel-card.active {
            border-color: var(--accent); background: rgba(59, 130, 246, 0.15);
        }
        
        .channel-info { flex: 1; overflow: hidden; }
        .channel-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-group { font-size: 12px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Loader */
        #loader { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <video id="video" controls autoplay></video>
    </div>

    <div id="sidebar">
        <div class="header">
            <h2>TV Carlos</h2>
            <p>Repositorio: Free-TV</p>
        </div>
        <div id="channel-grid">
            <div id="loader">Cargando la parrilla de programación...</div>
        </div>
    </div>

    <script>
        // Nueva URL Maestra de Free-TV
        const M3U_URL = 'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8';
        let hlsInstance = null;

        async function loadChannels() {
            try {
                const response = await fetch(M3U_URL);
                const text = await response.text();
                parseM3U(text);
            } catch (error) {
                document.getElementById('channel-grid').innerHTML = '<div id="loader" style="color:#ef4444;">Error de red. Verifica conexión o CORS.</div>';
            }
        }

        function parseM3U(text) {
            const lines = text.split('\n');
            const channels = [];
            let currentChannel = { group: 'General' };

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    // Extraer grupo si existe (group-title="Noticias")
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) currentChannel.group = groupMatch[1];
                    
                    // Extraer nombre (lo que está después de la última coma)
                    const parts = line.split(',');
                    currentChannel.name = parts[parts.length - 1].trim();
                } else if (line.startsWith('http') && line.includes('.m3u8')) {
                    currentChannel.url = line;
                    channels.push({...currentChannel}); // Guardar clon
                    currentChannel = { group: 'General' }; // Reiniciar
                }
            }
            // Para la prueba, renderizamos solo los primeros 100 para no saturar el DOM móvil
            renderChannels(channels.slice(0, 100)); 
        }

        function renderChannels(channels) {
            const grid = document.getElementById('channel-grid');
            grid.innerHTML = '';
            
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.tabIndex = index + 1; // Para que funcione con las flechas del control de la TV
                
                card.innerHTML = `
                    <div class="channel-info">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-group">${channel.group}</div>
                    </div>
                `;
                
                card.onclick = () => {
                    // Quitar clase activa de todos y ponerla en el actual
                    document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    playChannel(channel.url);
                };

                // Soporte para botón "OK" del control remoto
                card.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') { card.click(); }
                });

                grid.appendChild(card);
            });
        }

        function playChannel(url) {
            const video = document.getElementById('video');
            
            // Destruir instancia anterior de HLS si existe para limpiar memoria
            if (hlsInstance) { hlsInstance.destroy(); }

            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        loadChannels();
    </script>
</body>
</html>
